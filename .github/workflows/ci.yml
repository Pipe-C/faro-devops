
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Falla si aparece alguno de los patrones de diseño genérico.
      - run: npx --yes impeccable detect src/

  sentinel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/sentinel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/sentinel/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s ops/tests
      - run: python3 tools/check-commit-msg.py --log

  compose:
    runs-on: ubuntu-latest
    needs: [api, web, sentinel]
    steps:
      - uses: actions/checkout@v4

      - name: Inicializar entorno y certificados
        run: |
          python3 ops/faro_ops.py init
          python3 ops/faro_ops.py certs

      - name: Validar configuración Docker Compose
        run: docker compose config -q

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar el entorno y probarlo de extremo a extremo
        run: |
          # Puertos altos para el entorno de GitHub Actions.
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=8080/; s/^HTTPS_PORT=.*/HTTPS_PORT=8443/; s#^PUBLIC_URL=.*#PUBLIC_URL=https://faro.localhost:8443#' .env

          docker compose up -d --wait --wait-timeout 180 proxy sentinel prometheus grafana

          python3 ops/faro_ops.py smoke

      - name: Diagnosticar fallo del proxy
        if: always()
        run: |
          echo "======================================"
          echo "ESTADO DE LOS CONTENEDORES"
          echo "======================================"
          docker compose ps -a || true

          echo "======================================"
          echo "LOGS DEL PROXY"
          echo "======================================"
          docker compose logs --no-color --tail=100 proxy || true

          echo "======================================"
          echo "ESTADO DE SALUD DEL PROXY"
          echo "======================================"
          docker inspect faro-proxy-1 --format '{{json .State.Health}}' || true

          echo "======================================"
          echo "CONFIGURACION DE NGINX"
          echo "======================================"
          docker compose exec -T proxy nginx -T || true

      - name: Mostrar logs generales
        if: failure()
        run: docker compose logs --no-color --tail=80 || true
