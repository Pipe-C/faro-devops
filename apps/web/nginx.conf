# Servidor de estáticos de la SPA. Las cabeceras de seguridad y TLS las
# aplica el proxy inverso; aquí solo se gestiona la caché y el fallback de rutas.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los archivos de /assets llevan hash en el nombre: se pueden cachear un año.
    location /assets/ {
        # Un único Cache-Control (con `expires` se emitiría una segunda cabecera).
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea para que un despliegue nuevo se vea de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
