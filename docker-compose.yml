
# Faro · despliegue multicapa
#
#   Internet ──443/80──▶ proxy ──▶ web          (red `app`, interna)
#                          └─────▶ api ──▶ db
#   VPN ──51820/udp──▶ wireguard ──▶ grafana, prometheus, sentinel
#                                      (red `mgmt`, interna)
#
# Principio de diseño: SOLO el proxy (80/443) y WireGuard (51820/udp)
# publican puertos. La base de datos y el plano de monitoreo viven
# en redes internas, sin puertos publicados en el host.

name: faro

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Endurecimiento común.
x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

networks:
  edge: {}

  app:
    internal: true

  mgmt:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

# Secretos montados desde archivos.
secrets:
  db_password:
    file: ./deploy/secrets/db_password.txt

  db_root_password:
    file: ./deploy/secrets/db_root_password.txt

  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password.txt

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  letsencrypt:
  acme_webroot:

services:

  # -------------------------------------------------------------- PROXY
  proxy:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:stable-alpine
    cap_drop: [ALL]

    # Permite leer los certificados del grupo propietario.
    group_add:
      - "${CERTS_GID:-1000}"

    ports:
      - '${HTTP_PORT:-80}:8080'
      - '${HTTPS_PORT:-443}:8443'

    environment:
      DOMAIN: ${DOMAIN:-faro.localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://faro.localhost}

    volumes:
      - ./deploy/proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - acme_webroot:/var/www/certbot:ro

    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

    networks:
      - edge
      - app

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 3s
      retries: 3

  # --------------------------------------------------------------- WEB
  web:
    <<: *hardened
    build: ./apps/web
    image: faro/web:1.0.0
    cap_drop: [ALL]
    networks:
      - app

  # --------------------------------------------------------------- API
  api:
    <<: *hardened
    build: ./apps/api
    image: faro/api:1.0.0
    cap_drop: [ALL]

    # El contenedor no necesita escribir en su sistema de archivos.
    read_only: true
    tmpfs:
      - /tmp

    # Permite leer el secreto db_password.
    group_add:
      - "${SECRETS_GID:-1000}"

    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: db
      DB_USER: faro
      DB_NAME: faro
      DB_PASSWORD_FILE: /run/secrets/db_password
      SENTINEL_URL: http://sentinel:9100

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app
      - mgmt

  # --------------------------------------------------------------- DB
  db:
    <<: *hardened
    image: mysql:8.4

    # Permite leer db_password y db_root_password.
    group_add:
      - "${SECRETS_GID:-1000}"

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    environment:
      MYSQL_DATABASE: faro
      MYSQL_USER: faro
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password

    secrets:
      - db_password
      - db_root_password

    volumes:
      - db_data:/var/lib/mysql
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro

    networks:
      - app

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$(cat /run/secrets/db_root_password)" mysqladmin ping -h 127.0.0.1 -uroot --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------- SENTINEL
  sentinel:
    <<: *hardened
    build: ./apps/sentinel
    image: faro/sentinel:1.0.0
    cap_drop: [ALL]
    read_only: true

    tmpfs:
      - /tmp

    # Permite leer fullchain.pem.
    group_add:
      - "${CERTS_GID:-1000}"

    environment:
      API_URL: http://api:3000/health/ready
      CERT_PATH: /certs/fullchain.pem

    volumes:
      - ./deploy/certs:/certs:ro

    networks:
      - mgmt

  # --------------------------------------------------------- PROMETHEUS
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.5.0
    cap_drop: [ALL]

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - api
      - sentinel

    networks:
      - mgmt

  # ------------------------------------------------------------- GRAFANA
  grafana:
    <<: *hardened
    image: grafana/grafana:12.1.0
    cap_drop: [ALL]

    # Permite leer grafana_admin_password.
    group_add:
      - "${SECRETS_GID:-1000}"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'

    secrets:
      - grafana_admin_password

    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - mgmt

  # ----------------------------------------------------------- WIREGUARD
  wireguard:
    <<: *hardened
    image: lscr.io/linuxserver/wireguard:latest

    cap_add:
      - NET_ADMIN

    sysctls:
      net.ipv4.conf.all.src_valid_mark: '1'

    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Bogota}
      SERVERURL: ${WG_SERVERURL:-auto}
      SERVERPORT: ${WG_PORT:-51820}
      PEERS: ${WG_PEERS:-laptop}
      PEERDNS: auto
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: 10.13.13.0/24,172.28.0.0/24

    volumes:
      - ./deploy/wireguard:/config

    ports:
      - '${WG_PORT:-51820}:51820/udp'

    networks:
      - edge
      - mgmt

  # ------------------------------------------------------------- CERTBOT
  # Se ejecuta bajo demanda mediante los comandos de Let's Encrypt.
  certbot:
    profiles:
      - tools

    image: certbot/certbot:v3.3.0

    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
      - ./deploy/certs:/certs

    networks:
      - edge
