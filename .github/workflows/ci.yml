
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  # --------------------------------------------------------------- API
  api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # --------------------------------------------------------------- WEB
  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # Falla si aparece alguno de los patrones de diseño genérico.
      - run: npx --yes impeccable detect src/

  # ----------------------------------------------------------- SENTINEL
  sentinel:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/sentinel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/sentinel/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # ---------------------------------------------------------------- OPS
  ops:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python3 -m unittest discover -s ops/tests
      - run: python3 tools/check-commit-msg.py --log

  # ------------------------------------------------------------- COMPOSE
  compose:
    runs-on: ubuntu-latest
    needs: [api, web, sentinel]

    steps:
      - uses: actions/checkout@v4

      # Genera los secretos y certificados con permisos restringidos.
      - name: Inicializar entorno y certificados
        run: |
          set -e

          echo "======================================"
          echo "INICIALIZANDO FARO"
          echo "======================================"

          python3 ops/faro_ops.py init
          python3 ops/faro_ops.py certs

          echo "======================================"
          echo "CONFIGURANDO GRUPOS DE ACCESO"
          echo "======================================"

          # Obtener los GID reales de los directorios.
          SECRETS_GID="$(stat -c '%g' deploy/secrets)"
          CERTS_GID="$(stat -c '%g' deploy/certs)"

          # Evitar variables duplicadas en .env.
          sed -i '/^SECRETS_GID=/d; /^CERTS_GID=/d' .env

          # Compartir los GID con los servicios Docker.
          echo "SECRETS_GID=${SECRETS_GID}" >> .env
          echo "CERTS_GID=${CERTS_GID}" >> .env

          echo "SECRETS_GID=${SECRETS_GID}"
          echo "CERTS_GID=${CERTS_GID}"

          echo "======================================"
          echo "PERMISOS DE LOS SECRETOS"
          echo "======================================"

          stat -c '%A %a %u:%g %n' deploy/secrets
          stat -c '%A %a %u:%g %n' deploy/secrets/*

          echo "======================================"
          echo "PERMISOS DE LOS CERTIFICADOS"
          echo "======================================"

          stat -c '%A %a %u:%g %n' deploy/certs
          stat -c '%A %a %u:%g %n' deploy/certs/*

      # Comprueba la sintaxis y las referencias de Compose.
      - name: Validar configuración Docker Compose
        run: docker compose config -q

      # Construye las imágenes del proyecto.
      - name: Construir imágenes
        run: docker compose build

      # Levanta el recorrido completo y ejecuta las pruebas.
      - name: Levantar el entorno y probarlo de extremo a extremo
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURANDO PUERTOS DE CI"
          echo "======================================"

          # Puertos altos para GitHub Actions.
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=8080/; s/^HTTPS_PORT=.*/HTTPS_PORT=8443/; s#^PUBLIC_URL=.*#PUBLIC_URL=https://faro.localhost:8443#' .env

          echo "======================================"
          echo "LEVANTANDO SERVICIOS"
          echo "======================================"

          docker compose up -d --wait --wait-timeout 180 proxy sentinel prometheus grafana

          echo "======================================"
          echo "PRUEBAS DE HUMO"
          echo "======================================"

          python3 ops/faro_ops.py smoke

      # Diagnóstico cuando falla el despliegue.
      - name: Diagnosticar fallo del despliegue
        if: always()
        run: |
          echo "======================================"
          echo "ESTADO DE LOS CONTENEDORES"
          echo "======================================"

          docker compose ps -a || true

          echo "======================================"
          echo "LOGS DEL PROXY"
          echo "======================================"

          docker compose logs --no-color --tail=100 proxy || true

          echo "======================================"
          echo "LOGS DE LA API"
          echo "======================================"

          docker compose logs --no-color --tail=100 api || true

          echo "======================================"
          echo "LOGS DE MYSQL"
          echo "======================================"

          docker compose logs --no-color --tail=100 db || true

          echo "======================================"
          echo "LOGS DE GRAFANA"
          echo "======================================"

          docker compose logs --no-color --tail=100 grafana || true

          echo "======================================"
          echo "LOGS DE SENTINEL"
          echo "======================================"

          docker compose logs --no-color --tail=100 sentinel || true

          echo "======================================"
          echo "ESTADO DE SALUD DEL PROXY"
          echo "======================================"

          docker inspect faro-proxy-1 --format '{{json .State.Health}}' || true

          echo "======================================"
          echo "ESTADO DE SALUD DE LA API"
          echo "======================================"

          docker inspect faro-api-1 --format '{{json .State.Health}}' || true

          echo "======================================"
          echo "CONFIGURACION DE NGINX"
          echo "======================================"

          docker compose exec -T proxy nginx -T || true

      # Logs generales si cualquier paso del job falla.
      - name: Mostrar logs generales
        if: failure()
        run: docker compose logs --no-color --tail=80 || true
