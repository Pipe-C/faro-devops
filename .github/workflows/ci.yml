name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run check # tipos + separación diseño/código + pruebas
      - run: npm run build
      # Falla (código 2) si aparece alguno de los patrones de "diseño genérico de IA".
      - run: npx --yes impeccable detect src/

  sentinel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/sentinel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: apps/sentinel/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # el historial completo para validar los commits
      - run: python3 -m unittest discover -s ops/tests
      - run: python3 tools/check-commit-msg.py --log

  compose:
    runs-on: ubuntu-latest
    needs: [api, web, sentinel]
    steps:
      - uses: actions/checkout@v4
      - run: python3 ops/faro_ops.py init && python3 ops/faro_ops.py certs
      - run: docker compose config -q
      - run: docker compose build
      - name: Levantar el entorno y probarlo de extremo a extremo
        run: |
          # Puertos altos: los runners no permiten enlazar 80/443 sin privilegios.
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=8080/; s/^HTTPS_PORT=.*/HTTPS_PORT=8443/; s#^PUBLIC_URL=.*#PUBLIC_URL=https://faro.localhost:8443#' .env
          docker compose up -d --wait --wait-timeout 180 proxy sentinel prometheus grafana
          python3 ops/faro_ops.py smoke
      - if: failure()
        run: docker compose logs --tail=80
