# Faro · despliegue multicapa
#
#   Internet ──443/80──▶ proxy ──▶ web          (red `app`, interna)
#                          └─────▶ api ──▶ db
#   VPN ──51820/udp──▶ wireguard ──▶ grafana, prometheus, sentinel   (red `mgmt`, interna)
#
# Principio de diseño: SOLO el proxy (80/443) y WireGuard (51820/udp) publican
# puertos. La base de datos y todo el plano de monitoreo viven en redes
# `internal: true`, sin salida a Internet ni puertos en el host.
name: faro

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

# Endurecimiento común: reinicio automático, sin escalada de privilegios y logs rotados.
x-hardened: &hardened
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  logging: *logging

networks:
  edge: {} # la única con salida a Internet; aquí se publican puertos
  app:
    internal: true # proxy ↔ web ↔ api ↔ db
  mgmt:
    internal: true # monitoreo y administración, accesible solo por VPN
    ipam:
      config: [{ subnet: 172.28.0.0/24 }] # debe coincidir con ALLOWEDIPS de WireGuard

# Secretos en archivos (generados por `make init`): no aparecen en `docker inspect`
# ni en variables de entorno, y no se versionan.
secrets:
  db_password: { file: ./deploy/secrets/db_password.txt }
  db_root_password: { file: ./deploy/secrets/db_root_password.txt }
  grafana_admin_password: { file: ./deploy/secrets/grafana_admin_password.txt }

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  letsencrypt:
  acme_webroot:


services:
  # ---------------------------------------------------------------- capa de borde
  proxy:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:stable-alpine
    cap_drop: [ALL]

    # Permite a Nginx acceder al grupo propietario de los certificados.
    group_add:
      - "${CERTS_GID:-101}"

    ports:
      - '${HTTP_PORT:-80}:8080'
      - '${HTTPS_PORT:-443}:8443'

    environment:
      DOMAIN: ${DOMAIN:-faro.localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://faro.localhost}

    volumes:
      - ./deploy/proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - acme_webroot:/var/www/certbot:ro

    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

    networks: [edge, app]

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      retries: 3


  # ------------------------------------------------------------ capa de presentación
  web:
    <<: *hardened
    build: ./apps/web
    image: faro/web:1.0.0
    cap_drop: [ALL]
    networks: [app]

  # ----------------------------------------------------------------- capa de lógica
  api:
    <<: *hardened
    build: ./apps/api
    image: faro/api:1.0.0
    cap_drop: [ALL]
    read_only: true # el contenedor no necesita escribir en su sistema de archivos
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_HOST: db
      DB_USER: faro
      DB_NAME: faro
      DB_PASSWORD_FILE: /run/secrets/db_password
      SENTINEL_URL: http://sentinel:9100
    secrets: [db_password]
    depends_on:
      db: { condition: service_healthy }
    networks: [app, mgmt] # `mgmt` solo para que Prometheus lea /metrics

  # ------------------------------------------------------------------ capa de datos
  db:
    <<: *hardened
    image: mysql:8.4
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    environment:
      MYSQL_DATABASE: faro
      MYSQL_USER: faro
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - db_data:/var/lib/mysql # persistencia: los datos sobreviven a `docker compose down`
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    networks: [app]
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$(cat /run/secrets/db_root_password)" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------- monitoreo
  sentinel:
    <<: *hardened
    build: ./apps/sentinel
    image: faro/sentinel:1.0.0
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      API_URL: http://api:3000/health/ready
      CERT_PATH: /certs/fullchain.pem
    volumes:
      - ./deploy/certs:/certs:ro
    networks: [mgmt]

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.5.0
    cap_drop: [ALL]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api, sentinel]
    networks: [mgmt]

  grafana:
    <<: *hardened
    image: grafana/grafana:12.1.0
    cap_drop: [ALL]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [mgmt]

  # ------------------------------------------------------------------------- VPN
  # Puerta de entrada al plano de gestión. Los clientes entran por el túnel
  # WireGuard y resuelven por nombre (http://grafana:3000, http://prometheus:9090)
  # gracias a PEERDNS=auto, que usa el DNS interno de Docker.
  wireguard:
    <<: *hardened
    image: lscr.io/linuxserver/wireguard:latest
    cap_add: [NET_ADMIN] # necesario para crear la interfaz wg0 y las reglas NAT
    sysctls:
      net.ipv4.conf.all.src_valid_mark: '1'
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Bogota}
      SERVERURL: ${WG_SERVERURL:-auto}
      SERVERPORT: ${WG_PORT:-51820}
      PEERS: ${WG_PEERS:-laptop}
      PEERDNS: auto
      INTERNAL_SUBNET: 10.13.13.0
      # Túnel dividido: solo el tráfico hacia la VPN y la red `mgmt` pasa por él.
      ALLOWEDIPS: 10.13.13.0/24,172.28.0.0/24
    volumes:
      - ./deploy/wireguard:/config
    ports:
      - '${WG_PORT:-51820}:51820/udp'
    networks: [edge, mgmt]

  # --------------------------------------------------- herramienta puntual (no se levanta sola)
  # Se invoca con `make letsencrypt-issue` / `make letsencrypt-renew`.
  certbot:
    profiles: [tools]
    image: certbot/certbot:v3.3.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
      - ./deploy/certs:/certs
    networks: [edge]
